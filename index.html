<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Principal</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;display:flex;justify-content:center;align-items:center;height:100vh}
.menu{background:white;padding:30px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.15);text-align:center;min-width:320px}
h1{margin-top:0}
button,a.menu-btn{display:block;width:260px;padding:15px;margin:10px auto;border:none;border-radius:8px;background:#0078d4;color:#fff;font-size:18px;cursor:pointer;text-decoration:none;box-sizing:border-box}
button:hover,a.menu-btn:hover{background:#005ea6}
.hidden{display:none}
.back{background:#666}
.back:hover{background:#444}
.voice-btn{background:#28a745;margin-bottom:20px}
.voice-btn.listening{background:#dc3545;animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:0.6}100%{opacity:1}}
#status{font-size:14px;color:#555;margin-bottom:10px;min-height:20px}
</style>
</head>
<body>
<div class="menu">

<button id="micBtn" class="voice-btn" onclick="toggleSpeech()">Activer la dictée vocale</button>
<div id="status"></div>

<div id="mainMenu">
<h1>Menu Principal</h1>
<button onclick="showMenu('adminMenu')">Administration</button>
<button onclick="showMenu('soinsMenu')">Soins infirmiers</button>
<button onclick="showMenu('maintenanceMenu')">Maintenance</button>
</div>

<div id="adminMenu" class="hidden">
<h1>Administration</h1>
<a class="menu-btn" href="#">Formulaires</a>
<button class="back" onclick="showMenu('mainMenu')">Retour</button>
</div>

<div id="soinsMenu" class="hidden">
<h1>Soins infirmiers</h1>
<a class="menu-btn" href="#">Formulaires</a>
<button class="back" onclick="showMenu('mainMenu')">Retour</button>
</div>

<div id="maintenanceMenu" class="hidden">
<h1>Maintenance</h1>
<a class="menu-btn" href="Fin.html">Fin quart</a>
<a class="menu-btn" href="weekend.html">Tournée week-end</a>
<a class="menu-btn" href="maintenance audit master.xlsm">Audit</a>
<a class="menu-btn" href="suivi air.xlsx">Échangeur</a>
<button class="back" onclick="showMenu('mainMenu')">Retour</button>
</div>

</div>

<script>
function showMenu(id){
  document.querySelectorAll('.menu > div').forEach(el=>el.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// Configuration de la reconnaissance vocale
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'fr-FR';
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
    document.getElementById('status').textContent = 'Entendu : "' + transcript + '"';

    if (transcript.includes('administration') || transcript.includes('admin')) {
      showMenu('adminMenu');
    } else if (transcript.includes('soin') || transcript.includes('infirmier')) {
      showMenu('soinsMenu');
    } else if (transcript.includes('maintenance')) {
      showMenu('maintenanceMenu');
    } else if (transcript.includes('retour') || transcript.includes('principal') || transcript.includes('accueil')) {
      showMenu('mainMenu');
    }
  };

  recognition.onerror = (e) => {
    document.getElementById('status').textContent = 'Erreur ou micro bloqué.';
    stopListening();
  };

  recognition.onend = () => {
    if (isListening) recognition.start(); // Relance auto si toujours actif
  };
} else {
  document.getElementById('micBtn').disabled = true;
  document.getElementById('status').textContent = 'Dictée vocale non supportée par ce navigateur.';
}

function toggleSpeech() {
  if (!recognition) return;
  if (isListening) {
    stopListening();
  } else {
    startListening();
  }
}

function startListening() {
  isListening = true;
  recognition.start();
  const btn = document.getElementById('micBtn');
  btn.textContent = 'Écoute en cours... (Cliquer pour stopper)';
  btn.classList.add('listening');
  document.getElementById('status').textContent = 'Parlez maintenant...';
}

function stopListening() {
  isListening = false;
  if (recognition) recognition.stop();
  const btn = document.getElementById('micBtn');
  btn.textContent = 'Activer la dictée vocale';
  btn.classList.remove('listening');
  document.getElementById('status').textContent = '';
}
</script>
</body>
</html>
