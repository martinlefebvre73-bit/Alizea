<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Principal</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;display:flex;justify-content:center;align-items:center;height:100vh}
.menu{background:white;padding:30px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.15);text-align:center;min-width:320px}
h1{margin-top:0}
button,a.menu-btn{display:block;width:260px;padding:15px;margin:10px auto;border:none;border-radius:8px;background:#0078d4;color:#fff;font-size:18px;cursor:pointer;text-decoration:none;box-sizing:border-box}
button:hover,a.menu-btn:hover{background:#005ea6}
.hidden{display:none}
.back{background:#666}
.back:hover{background:#444}
</style>
</head>
<body>
<div class="menu">

<div id="mainMenu">
<h1>Menu Principal</h1>
<button onclick="showMenu('adminMenu')">Administration</button>
<button onclick="showMenu('soinsMenu')">Soins infirmiers</button>
<button onclick="showMenu('maintenanceMenu')">Maintenance</button>
</div>

<div id="adminMenu" class="hidden">
<h1>Administration</h1>
<a class="menu-btn" href="#">Formulaires</a>
<button class="back" onclick="showMenu('mainMenu')">Retour</button>
</div>

<div id="soinsMenu" class="hidden">
<h1>Soins infirmiers</h1>
<a class="menu-btn" href="#">Formulaires</a>
<button class="back" onclick="showMenu('mainMenu')">Retour</button>
</div>

<div id="maintenanceMenu" class="hidden">
<h1>Maintenance</h1>
<a class="menu-btn" href="Fin.html">Fin quart</a>
<a class="menu-btn" href="weekend.html">Tournée week-end</a>
<a class="menu-btn" href="maintenance audit master.xlsm">Audit</a>
<a class="menu-btn" href="suivi air.xlsx">Échangeur</a>
<button class="back" onclick="showMenu('mainMenu')">Retour</button>
</div>

</div>
<script>
function showMenu(id){
  document.querySelectorAll('.menu > div').forEach(el=>el.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
</script>
</body>
</html>
