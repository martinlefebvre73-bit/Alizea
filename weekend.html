<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournée de plancher week-end</title>
<style>
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef5ff;
    margin: 20px;
}

.btn-retour {
    display: inline-block;
    padding: 10px 18px;
    background-color: #64748b;
    color: #ffffff;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    border-radius: 6px;
    margin-bottom: 15px;
    transition: background-color 0.2s ease;
}

.btn-retour:hover {
    background-color: #475569;
}

h1 {
    text-align: center;
    color: #005a9e;
    background: #fff;
    border: 3px solid #0078d4;
    border-radius: 10px;
    padding: 12px;
    margin-top: 0;
}

.fiche {
    background: #fff;
    border: 3px solid #0078d4;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 15px;
}

.controls {
    text-align: center;
    margin: 15px 0;
}

button {
    background: #0078d4;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    margin: 4px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #005ea6;
}

.btn-clear {
    background: #d83b01;
}

.btn-clear:hover {
    background: #a82e00;
}

.speech-btn {
    padding: 4px 8px;
    background: #00a4ef;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border: 3px solid #0078d4;
}

th {
    background: #0078d4;
    color: #fff;
    border: 2px solid #005a9e;
    padding: 8px;
}

td {
    border: 2px solid #7fb8ff;
    padding: 6px;
}

.etape {
    background: #dbeeff;
    font-weight: bold;
    color: #003b6f;
    text-align: center;
}

input[type=text] {
    width: 80%;
    padding: 5px;
    border: 2px solid #0078d4;
    border-radius: 4px;
    box-sizing: border-box;
}

input[type=checkbox] {
    transform: scale(1.3);
    accent-color: #0078d4;
}

@media print {
    .controls, .speech-btn, .btn-retour {
        display: none !important;
    }
    body {
        background: white;
        margin: 0;
    }
    input[type=text] {
        border: none;
    }
}
</style>
</head>
<body>

<a href="index.html" class="btn-retour">← Menu principal</a>

<h1>Tournée de plancher week-end</h1>

<div class="fiche">
    <strong>Vérificateur :</strong> 
    <input type="text" id="verificateur">
    <button type="button" class="speech-btn" onclick="startDictation('verificateur')">🎤</button>
</div>

<div class="controls">
    <button type="button" onclick="window.print()">Sauvegarder PDF</button>
    <button type="button" class="btn-clear" onclick="effacerFormulaire()">Effacer</button>
</div>

<table>
    <thead>
        <tr>
            <th style="width: 50px;">N°</th>
            <th>Lieu</th>
            <th style="width: 80px;">Vérifié</th>
            <th>Commentaires</th>
        </tr>
    </thead>
    <tbody id="tbody"></tbody>
</table>

<script>
const d = [
    ["", "7h30 TEST PISCINE", "e"],
    [1, 'Escaliers + coté Piscine'],
    [2, 'Depot décoration'],
    [3, 'Depot #Pneu'],
    [4, 'Recyclage'],
    [5, 'Atelier commun'],
    [6, 'Salon coiffure'],
    [7, 'Chauffe-eau'],
    [8, 'Vidange'],
    [9, 'Depot (salle électrique)'],
    [10, 'Salle Électrique'],
    [11, 'Pompe'],
    [12, 'Sortie secours face Pompe'],
    [13, 'Porte garage PHASE 2'],
    [14, 'Salle ENTREE Bell'],
    [15, 'Sortie secours face ascenseur 2'],
    [16, 'Ascenseur jusque 6e'],
    [17, 'Sortie secours #652'],
    [18, 'Sortie #620'],
    [19, 'Buanderie'],
    [20, 'Déchet'],
    [21, 'Sortie #609'],
    ["", 'Descendre au 5 ieme Étage', "e"],
    [22, 'Buanderie'],
    [23, 'Sortie 521'],
    [24, 'Sortie 552'],
    ["", 'Descendre au 4 ieme Étage', "e"],
    [25, 'Sortie 421'],
    [26, 'Buanderie'],
    [27, 'Entretien'],
    [28, 'Sortie 409'],
    ["", 'Descendre au 3 ieme Étage', "e"],
    [29, 'Buanderie'],
    [30, 'Sortie 321'],
    [31, 'Sortie 352'],
    ["", 'Descendre au 2 ieme Étage', "e"],
    [32, 'Sortie 221'],
    [33, 'Buanderie'],
    [34, 'Déchet'],
    [35, 'Bibli'],
    [36, 'Sortie'],
    ["", 'Descendre au rez-de-chaussée', "e"],
    [37, 'Salle communautaire'],
    [38, 'Entretien'],
    [39, 'Billard'],
    [40, 'Salon'],
    [41, 'Depot admin'],
    [42, 'Golf'],
    [43, 'Buanderie'],
    [44, 'Sortie 121'],
    [45, 'Salle Casse-tête'],
    [46, 'Chapelle'],
    [47, 'Comptoir Piano'],
    [48, 'Salle Conférence (comité résidents)'],
    [49, 'Gym'],
    [50, 'Cinéma'],
    [51, 'Entretien'],
    ["", 'Terminée', "e"]
];

const tb = document.getElementById('tbody');

d.forEach((r, i) => {
    if (r[2] === 'e') {
        tb.innerHTML += `<tr><td colspan='4' class='etape'>${r[1]}</td></tr>`;
    } else {
        tb.innerHTML += `<tr>
            <td style='text-align:center'>${r[0]}</td>
            <td>${r[1]}</td>
            <td style='text-align:center'><input type='checkbox'></td>
            <td>
                <input type='text' id='c${i}'>
                <button type='button' class='speech-btn' onclick="startDictation('c${i}')">🎤</button>
            </td>
        </tr>`;
    }
});

function effacerFormulaire() {
    document.querySelectorAll('input[type=text]').forEach(x => x.value = '');
    document.querySelectorAll('input[type=checkbox]').forEach(x => x.checked = false);
}

function startDictation(id) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
        alert('Dictée vocale non supportée par votre navigateur');
        return;
    }
    const r = new SR();
    r.lang = 'fr-CA';
    r.onresult = e => {
        const field = document.getElementById(id);
        const text = e.results[0][0].transcript;
        field.value += (field.value ? " " : "") + text;
    };
    r.start();
}
</script>
</body>
</html>
