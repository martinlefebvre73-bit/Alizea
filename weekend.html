<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournée de plancher week-end</title>
<style>
:root {
    --primary-color: #2c3e50;
    --accent-color: #27ae60;
    --secondary-color: #2980b9;
    --print-color: #8e44ad;
    --bg-color: #f8f9fa;
    --card-bg: #ffffff;
    --border-color: #e2e8f0;
    --text-color: #333333;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    background: var(--card-bg);
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

.btn-retour {
    display: inline-block;
    padding: 8px 14px;
    background-color: #64748b;
    color: #ffffff;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    border-radius: 6px;
    margin-bottom: 15px;
    transition: background-color 0.2s ease;
}

.btn-retour:hover {
    background-color: #475569;
}

h1 {
    color: var(--primary-color);
    margin: 0 0 15px 0;
    font-size: 1.8rem;
    text-align: center;
}

.meta-fields {
    display: flex;
    gap: 20px;
    margin-bottom: 25px;
    flex-wrap: wrap;
    background: #f7fafc;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
}

.meta-field {
    display: flex;
    align-items: center;
    gap: 10px;
}

.meta-field label {
    font-weight: bold;
    color: var(--primary-color);
}

.meta-field input {
    padding: 6px 10px;
    border: 1px solid #cbd5e0;
    border-radius: 4px;
    font-size: 0.95rem;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

th, td {
    padding: 12px 15px;
    text-align: left;
    border-bottom: 1px solid var(--border-color);
}

th {
    background-color: var(--primary-color);
    color: white;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
}

tr:hover {
    background-color: #f1f5f9;
}

.col-num {
    width: 50px;
    text-align: center;
    font-weight: bold;
    color: #718096;
}

.col-task {
    font-size: 0.95rem;
    line-height: 1.4;
}

.col-fait {
    width: 80px;
    text-align: center;
}

.col-comment {
    width: 35%;
}

.etape {
    background: #dbeeff;
    font-weight: bold;
    color: #003b6f;
    text-align: center;
}

.checkbox-custom {
    width: 22px;
    height: 22px;
    cursor: pointer;
    accent-color: var(--accent-color);
}

.comment-container {
    display: flex;
    gap: 6px;
    align-items: center;
}

.comment-input {
    width: 100%;
    padding: 8px;
    border: 1px solid #cbd5e0;
    border-radius: 4px;
    font-size: 0.9rem;
    transition: border-color 0.2s;
}

.comment-input:focus {
    outline: none;
    border-color: var(--primary-color);
}

.mic-btn {
    background: #e2e8f0;
    border: none;
    border-radius: 4px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.mic-btn:hover {
    background: #cbd5e0;
}

.mic-btn.recording {
    background: #e53e3e;
    color: white;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
}

/* Bas de page et boutons (identiques au fichier entretien) */
.footer-section {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 2px dashed var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.signature-box {
    display: flex;
    align-items: center;
    gap: 10px;
}

.signature-box input {
    padding: 8px;
    border: 1px solid #cbd5e0;
    border-radius: 4px;
    min-width: 250px;
}

.actions-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.btn-action {
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
    color: white;
}

.btn-save {
    background: var(--accent-color);
}

.btn-save:hover {
    background: #219150;
}

.btn-load {
    background: var(--secondary-color);
}

.btn-load:hover {
    background: #1f618d;
}

.btn-print {
    background: var(--print-color);
}

.btn-print:hover {
    background: #763e9b;
}

.btn-action:disabled {
    background: #a0aec0;
    cursor: not-allowed;
}

.btn-reset {
    background: #718096;
    color: white;
}

.btn-reset:hover {
    background: #4a5568;
}

/* Modal / Pop-up de recherche */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.modal-card {
    background: white;
    padding: 25px;
    border-radius: 10px;
    max-width: 450px;
    width: 90%;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.modal-card h3 {
    margin-top: 0;
    color: var(--primary-color);
}

.modal-field {
    margin-bottom: 15px;
}

.modal-field label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
    font-size: 0.9rem;
}

.modal-field input {
    width: 100%;
    padding: 8px;
    border: 1px solid #cbd5e0;
    border-radius: 4px;
    box-sizing: border-box;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

@media print {
    .btn-retour, .mic-btn, .actions-group, .modal-overlay {
        display: none !important;
    }
    body {
        padding: 0;
        background: white;
    }
    .container {
        box-shadow: none;
        padding: 0;
        max-width: 100%;
    }
    .comment-input, .meta-field input, .signature-box input {
        border: none;
        border-bottom: 1px solid #000;
        background: transparent;
    }
}
</style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-retour">← Menu principal</a>

    <h1>Tournée de plancher week-end</h1>

    <div class="meta-fields">
        <div class="meta-field">
            <label for="date-input">Date :</label>
            <input type="date" id="date-input">
        </div>
        <div class="meta-field">
            <label for="verificateur">Vérificateur :</label>
            <input type="text" id="verificateur" placeholder="Nom du vérificateur">
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th class="col-num">N°</th>
                <th class="col-task">Lieu</th>
                <th class="col-fait">Vérifié</th>
                <th class="col-comment">Commentaires (Dictée vocale 🎤)</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <!-- Pied de page avec boutons identiques à la page d'entretien -->
    <div class="footer-section">
        <div class="signature-box">
            <label for="signature-input"><strong>Signature / Validation :</strong></label>
            <input type="text" id="signature-input" placeholder="Signature de l'agent">
        </div>
        <div class="actions-group">
            <button class="btn-action btn-save" id="btn-save" onclick="saveToFirebase()">Enregistrer dans Firebase</button>
            <button class="btn-action btn-load" id="btn-load" onclick="openSearchModal()">Charger depuis Firebase</button>
            <button class="btn-action btn-print" onclick="window.print()">🖨️ Imprimer / PDF</button>
            <button class="btn-action btn-reset" onclick="resetForm()">Réinitialiser</button>
        </div>
    </div>
</div>

<!-- Modal de recherche de rapport -->
<div class="modal-overlay" id="searchModal">
    <div class="modal-card">
        <h3>Rechercher un rapport</h3>
        
        <div class="modal-field">
            <label for="search-date">Filtrer par date :</label>
            <input type="date" id="search-date">
        </div>

        <div class="modal-field">
            <label for="search-keyword">Recherche par mot-clé (Nom, vérificateur, etc.) :</label>
            <input type="text" id="search-keyword" placeholder="Ex: Martin, piscine...">
        </div>

        <div class="modal-buttons">
            <button class="btn-action btn-reset" onclick="closeSearchModal()">Annuler</button>
            <button class="btn-action btn-load" onclick="executeFirebaseSearch()">Rechercher</button>
        </div>
    </div>
</div>

<!-- SDK Firebase configuré pour la collection 'weekend' -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyASNjEZ9tyR7VzHycAPJ65BeTuh6baOWYc",
        authDomain: "alizea-26f19.firebaseapp.com",
        projectId: "alizea-26f19",
        storageBucket: "alizea-26f19.firebasestorage.app",
        messagingSenderId: "274553836522",
        appId: "1:274553836522:web:8271e290e1cbd41fb01893",
        measurementId: "G-GFVWC7TWJ0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Contrôles de la fenêtre Modal
    window.openSearchModal = function() {
        document.getElementById('search-date').value = document.getElementById('date-input').value;
        document.getElementById('searchModal').style.display = 'flex';
    };

    window.closeSearchModal = function() {
        document.getElementById('searchModal').style.display = 'none';
    };

    // Enregistrement spécifique dans la collection 'weekend'
    window.saveToFirebase = async function() {
        const btnSave = document.getElementById('btn-save');
        const verificateur = document.getElementById('verificateur').value.trim();
        const date = document.getElementById('date-input').value;
        const signature = document.getElementById('signature-input').value.trim();

        if (!verificateur) {
            alert("Veuillez saisir le nom du vérificateur avant de sauvegarder.");
            document.getElementById('verificateur').focus();
            return;
        }

        const rows = document.querySelectorAll('#tbody tr[data-num]');
        const tasks = [];

        rows.forEach(row => {
            const num = row.getAttribute('data-num');
            const description = row.querySelector('.col-task').innerText.trim();
            const completed = row.querySelector('.checkbox-custom').checked;
            const comment = row.querySelector('.comment-input').value.trim();

            tasks.push({
                num: parseInt(num, 10),
                description: description,
                completed: completed,
                comment: comment
            });
        });

        const reportData = {
            type: "Tournée Week-end",
            date: date,
            verificateur: verificateur,
            signature: signature,
            timestamp: serverTimestamp(),
            tasks: tasks
        };

        try {
            btnSave.disabled = true;
            btnSave.innerText = "Enregistrement en cours...";

            // Cible spécifiquement la collection 'weekend'
            const docRef = await addDoc(collection(db, "weekend"), reportData);
            alert("Rapport enregistré avec succès dans la collection 'weekend' ! (ID: " + docRef.id + ")");
        } catch (error) {
            console.error("Erreur lors de l'enregistrement : ", error);
            alert("Erreur lors de l'enregistrement : " + error.message);
        } finally {
            btnSave.disabled = false;
            btnSave.innerText = "Enregistrer dans Firebase";
        }
    };

    // Recherche et chargement depuis la collection 'weekend'
    window.executeFirebaseSearch = async function() {
        const btnLoad = document.getElementById('btn-load');
        const searchDate = document.getElementById('search-date').value;
        const searchKeyword = document.getElementById('search-keyword').value.trim().toLowerCase();

        closeSearchModal();

        try {
            btnLoad.disabled = true;
            btnLoad.innerText = "Recherche...";

            const collectionRef = collection(db, "weekend");
            let docsList = [];

            if (searchDate) {
                const q = query(collectionRef, where("date", "==", searchDate));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach(doc => docsList.push(doc.data()));
            } else {
                const q = query(collectionRef, orderBy("timestamp", "desc"), limit(20));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach(doc => docsList.push(doc.data()));
            }

            if (searchKeyword !== '') {
                docsList = docsList.filter(data => {
                    const verifMatch = (data.verificateur || '').toLowerCase().includes(searchKeyword);
                    const sigMatch = (data.signature || '').toLowerCase().includes(searchKeyword);
                    const taskMatch = Array.isArray(data.tasks) && data.tasks.some(t => 
                        (t.comment || '').toLowerCase().includes(searchKeyword) ||
                        (t.description || '').toLowerCase().includes(searchKeyword)
                    );
                    return verifMatch || sigMatch || taskMatch;
                });
            }

            if (docsList.length === 0) {
                alert("Aucun rapport ne correspond à vos critères de recherche.");
                return;
            }

            docsList.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
            const data = docsList[0];

            if (data.date) document.getElementById('date-input').value = data.date;
            if (data.verificateur) document.getElementById('verificateur').value = data.verificateur;
            if (data.signature) document.getElementById('signature-input').value = data.signature;

            if (Array.isArray(data.tasks)) {
                data.tasks.forEach(task => {
                    const row = document.querySelector(`#tbody tr[data-num="${task.num}"]`);
                    if (row) {
                        const checkbox = row.querySelector('.checkbox-custom');
                        const commentInput = row.querySelector('.comment-input');
                        if (checkbox) checkbox.checked = !!task.completed;
                        if (commentInput) commentInput.value = task.comment || '';
                    }
                });
            }

            alert("Rapport chargé avec succès !");
        } catch (error) {
            console.error("Erreur lors du chargement : ", error);
            alert("Erreur lors du chargement : " + error.message);
        } finally {
            btnLoad.disabled = false;
            btnLoad.innerText = "Charger depuis Firebase";
        }
    };
</script>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let currentInput = null;
    let currentBtn = null;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.lang = 'fr-CA';
        recognition.interimResults = false;

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            if (currentInput) {
                currentInput.value = currentInput.value ? currentInput.value + " " + transcript : transcript;
            }
        };

        recognition.onend = function() {
            if (currentBtn) currentBtn.classList.remove('recording');
            currentInput = null;
            currentBtn = null;
        };

        recognition.onerror = function(event) {
            if (currentBtn) currentBtn.classList.remove('recording');
            alert("Erreur de dictée vocale : " + event.error);
        };
    }

    function toggleDictation(btn, inputId) {
        if (!SpeechRecognition) {
            alert("La dictée vocale n'est pas supportée sur ce navigateur.");
            return;
        }

        const input = document.getElementById(inputId);

        if (currentBtn === btn) {
            recognition.stop();
            return;
        }

        if (currentBtn) recognition.stop();

        currentInput = input;
        currentBtn = btn;
        btn.classList.add('recording');
        recognition.start();
    }

    function resetForm() {
        if (confirm("Voulez-vous vraiment réinitialiser toutes les cases et tous les commentaires ?")) {
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            document.querySelectorAll('input[type="text"]').forEach(input => input.value = '');
            document.getElementById('date-input').value = new Date().toISOString().split('T')[0];
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById('date-input').value = new Date().toISOString().split('T')[0];
    });
</script>
