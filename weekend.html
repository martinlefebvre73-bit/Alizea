Ascenseur jusque 6e'],[17,'Sortie secours #652'],[18,'Sortie #620'],[19,'Buanderie'],[20,'Déchet'],[21,'Sortie #609'],['','Descendre au 5 ieme Étage','e'],[22,'Buanderie'],[23,'Sortie 521'],[24,'Sortie 552'],['','Descendre au 4 ieme Étage','e'],[25,'Sortie 421'],[26,'Buanderie'],[27,'Entretien'],[28,'Sortie 409'],['','Descendre au 3 ieme Étage','e'],[29,'Buanderie'],[30,'Sortie 321'],[31,'Sortie 352'],['','Descendre au 2 ieme Étage','e'],[32,'Sortie 221'],[33,'Buanderie'],[34,'Déchet'],[35,'Bibli'],[36,'Sortie'],['','Descendre au rez-de-chaussée','e'],[37,'Salle communautaire'],[38,'Entretien'],[39,'Billard'],[40,'Salon'],[41,'Depot admin'],[42,'Golf'],[43,'Buanderie'],[44,'Sortie 121'],[45,'Salle Casse-tête'],[46,'Chapelle'],[47,'Comptoir Piano'],[48,'Salle Conférence (comité résidents)'],[49,'Gym'],[50,'Cinéma'],[51,'Entretien'],['','Terminée','e']];const tb=document.getElementById('tbody');d.forEach((r,i)=>{if(r[2]==='e'){tb.innerHTML+=`<tr><td colspan='4' class='etape'>${r[1]}</td></tr>`;}else{tb.innerHTML+=`<tr><td>${r[0]}</td><td>${r[1]}</td><td style='text-align:center'><input type='checkbox'></td><td><input type='text' id='c${i}'><button class='speech-btn' onclick="startDictation('c${i}')">🎤</button></td></tr>`;}});function effacerFormulaire(){document.querySelectorAll('input[type=text]').forEach(x=>x.value='');document.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=false);}function startDictation(id){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Dictée vocale non supportée');return;}const r=new SR();r.lang='fr-CA';r.onresult=e=>document.getElementById(id).value=e.results[0][0].transcript;r.start();}</script></body></html>
