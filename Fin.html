<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapport de Fin de Quart</title>

<style>
:root {
    --primary-color: #0078D4;
    --accent-color: #27ae60;
    --secondary-color: #2980b9;
    --print-color: #8e44ad;
    --bg-color: #eef4fb;
    --card-bg: #ffffff;
    --border-color: #b9c5d3;
    --text-color: #333333;
}

@media print {
    .actions,
    .voice,
    .btn-retour,
    .actions-group,
    .modal-overlay {
        display: none !important;
    }
    body {
        background: white;
        margin: 0;
    }
    .section {
        page-break-inside: avoid;
    }
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    margin: 15px;
}

#formulaire {
    max-width: 1200px;
    margin: auto;
}

.btn-retour {
    display: inline-block;
    padding: 10px 18px;
    background-color: #64748b;
    color: #ffffff;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    border-radius: 6px;
    margin-bottom: 15px;
    transition: background-color 0.2s ease;
}

.btn-retour:hover {
    background-color: #475569;
}

.entete {
    background: var(--primary-color);
    color: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 15px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.20);
}

.section {
    background: white;
    border: 2px solid var(--primary-color);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 15px;
    box-shadow: 0 2px 6px rgba(0,0,0,.10);
}

.section-title {
    background: var(--primary-color);
    color: white;
    padding: 12px;
    font-size: 18px;
    font-weight: bold;
    text-transform: uppercase;
}

.section-content {
    padding: 15px;
}

.row {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.col {
    flex: 1;
    min-width: 250px;
}

label {
    display: block;
    font-weight: 600;
    margin-top: 10px;
}

input,
select,
textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    font-size: 16px;
    box-sizing: border-box;
}

textarea {
    min-height: 120px;
}

.checkbox-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 10px;
}

.voice {
    background: #00A4EF;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 5px;
    margin-top: 5px;
    cursor: pointer;
}

.signature-box {
    width: 100%;
    height: 300px;
    border: 3px solid var(--primary-color);
    border-radius: 8px;
    touch-action: none;
    background: white;
}

/* Bas de page & Boutons d'action */
.footer-section {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 2px dashed #cbd5e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.10);
}

.signature-input-box {
    display: flex;
    align-items: center;
    gap: 10px;
}

.signature-input-box input {
    padding: 8px;
    border: 1px solid #cbd5e0;
    border-radius: 4px;
    min-width: 250px;
    margin-top: 0;
}

.actions-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.btn-action {
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
    color: white;
    font-size: 14px;
}

.btn-save {
    background: var(--accent-color);
}

.btn-save:hover {
    background: #219150;
}

.btn-load {
    background: var(--secondary-color);
}

.btn-load:hover {
    background: #1f618d;
}

.btn-print {
    background: var(--print-color);
}

.btn-print:hover {
    background: #763e9b;
}

.btn-action:disabled {
    background: #a0aec0;
    cursor: not-allowed;
}

.btn-reset {
    background: #718096;
    color: white;
}

.btn-reset:hover {
    background: #4a5568;
}

/* Modal / Pop-up de recherche */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.modal-card {
    background: white;
    padding: 25px;
    border-radius: 10px;
    max-width: 450px;
    width: 90%;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.modal-card h3 {
    margin-top: 0;
    color: var(--primary-color);
}

.modal-field {
    margin-bottom: 15px;
}

.modal-field label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
    font-size: 0.9rem;
}

.modal-field input {
    width: 100%;
    padding: 8px;
    border: 1px solid #cbd5e0;
    border-radius: 4px;
    box-sizing: border-box;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div id="formulaire">

<a href="index.html" class="btn-retour">← Menu principal</a>

<div class="entete">
<h1>RAPPORT DE FIN DE QUART</h1>
</div>

<div class="section">
<div class="section-title">
Informations générales

<div class="section-content">

<div class="row">

<div class="col">

<input type="date" id="date">

<div class="col">
<label>Horaire</label>
<select id="horaire">
<option>Jour</option>

</div>

</div>

<label>Nom</label>
<input type="text" id="nom">

<button type="button" class="voice" onclick="dictee('nom')">
🎤 Dictée

</div>
</div>

<div class="section">

<div class="section-title">
Sujets traités

<div class="section-content">

<div class="checkbox-grid" id="sujets-traites">

<label><input type="checkbox" value="Appels de service complétés"> Appels de service complétés</label>

<label><input type="checkbox" value="Inspection générale"> Inspection générale</label>

<label><input type="checkbox" value="Intervention d'urgence"> Intervention d'urgence</label>

<label><input type="checkbox" value="Suivi travaux en cours"> Suivi travaux en cours</label>

<label><input type="checkbox" value="Vérification équipements mécaniques"> Vérification équipements mécaniques</label>

<label><input type="checkbox" value="Vérification systèmes électriques"> Vérification systèmes électriques</label>

<label><input type="checkbox" value="Nettoyage / entretien installations"> Nettoyage / entretien installations</label>

<label><input type="checkbox" value="Autre"> Autre</label>

</div>

</div>

</div>

<div class="section">
<div class="section-title">
Appels de service complétés
</div>

<div class="section-content">

<textarea id="appels"></textarea>

<button type="button" class="voice" onclick="dictee('appels')">
🎤 Dictée
</button>

</div>
</div>

<div class="section">
<div class="section-title">
Interventions
</div>

<div class="section-content">

<textarea id="interventions"></textarea>

<button type="button" class="voice" onclick="dictee('interventions')">
🎤 Dictée
</button>

</div>

<div class="section">

Piscine

<textarea id="piscine"></textarea>

Intervention d'urgence

🎤 Dictée

<div class="section-title">
Suivi des travaux
</div>

<textarea id="travaux"></textarea>

<button type="button" class="voice" onclick="dictee('travaux')">
🎤 Dictée
</button>

Autres observations
</div>

<button type="button" class="voice" onclick="dictee('observations')">
🎤 Dictée
</button>

Détails et variants

<div class="section">

<div class="section-title">
Signature
</div>

<div class="section-content">

<canvas id="signature" class="signature-box"></canvas>

<div style="margin-top: 10px; text-align: center;">
    <button type="button" class="btn-action btn-reset" onclick="effacerSignature()">
        Effacer Signature
    </button>

</div>

</div>

<!-- Configuration du Bas de Page Identique à 'entretien' -->
<div class="footer-section">
    <div class="signature-input-box">
        <label for="signature-input"><strong>Validation Nom / Initiales :</strong></label>
        <input type="text" id="signature-input" placeholder="Signature de l'agent">
    </div>
    <div class="actions-group">
        <button class="btn-action btn-save" id="btn-save" onclick="saveToFirebase()">Enregistrer dans Firebase</button>
        <button class="btn-action btn-load" id="btn-load" onclick="openSearchModal()">Charger depuis Firebase</button>
        <button class="btn-action btn-print" onclick="window.print()">🖨️ Imprimer / PDF</button>
        <button class="btn-action btn-reset" onclick="resetForm()">Réinitialiser</button>
    </div>
</div>

</div>

<!-- Pop-up de Recherche Firebase -->
<div class="modal-overlay" id="searchModal">
    <div class="modal-card">
        <h3>Rechercher un rapport</h3>
        
        <div class="modal-field">
            <label for="search-date">Filtrer par date :</label>
            <input type="date" id="search-date">
        </div>

        <div class="modal-field">
            <label for="search-keyword">Recherche par mot-clé (Nom, agent, etc.) :</label>
            <input type="text" id="search-keyword" placeholder="Ex: Martin, urgence...">
        </div>

        <div class="modal-buttons">
            <button class="btn-action btn-reset" onclick="closeSearchModal()">Annuler</button>
            <button class="btn-action btn-load" onclick="executeFirebaseSearch()">Rechercher</button>
        </div>
    </div>
</div>

<!-- SDK Firebase via modules ESM -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyASNjEZ9tyR7VzHycAPJ65BeTuh6baOWYc",
        authDomain: "alizea-26f19.firebaseapp.com",
        projectId: "alizea-26f19",
        storageBucket: "alizea-26f19.firebasestorage.app",
        messagingSenderId: "274553836522",
        appId: "1:274553836522:web:8271e290e1cbd41fb01893",
        measurementId: "G-GFVWC7TWJ0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Fenêtre Modal handlers
    window.openSearchModal = function() {
        document.getElementById('search-date').value = document.getElementById('date').value;
        document.getElementById('searchModal').style.display = 'flex';
    };

    window.closeSearchModal = function() {
        document.getElementById('searchModal').style.display = 'none';
    };

    // Enregistrement dans la collection 'fin'
    window.saveToFirebase = async function() {
        const btnSave = document.getElementById('btn-save');
        const nom = document.getElementById('nom').value.trim();
        const date = document.getElementById('date').value;
        const horaire = document.getElementById('horaire').value;
        const signatureText = document.getElementById('signature-input').value.trim();

        if (!nom) {
            alert("Veuillez saisir votre nom avant de sauvegarder.");
            document.getElementById('nom').focus();
            return;
        }

        // Récupérer les données du formulaire
        const sujetsTraites = Array.from(document.querySelectorAll('#sujets-traites input[type="checkbox"]:checked')).map(cb => cb.parentNode.textContent.trim());
        const piscineOptions = Array.from(document.querySelectorAll('#piscine-options input[type="checkbox"]:checked')).map(cb => cb.parentNode.textContent.trim());

        const reportData = {
            type: "Rapport de Fin de Quart",
            date: date,
            horaire: horaire,
            nom: nom,
            signatureText: signatureText,
            sujetsTraites: sujetsTraites,
            appels: document.getElementById('appels').value.trim(),
            interventions: document.getElementById('interventions').value.trim(),
            piscineOptions: piscineOptions,
            piscine: document.getElementById('piscine').value.trim(),
            urgence: document.getElementById('urgence').value.trim(),
            travaux: document.getElementById('travaux').value.trim(),
            observations: document.getElementById('observations').value.trim(),
            details: document.getElementById('details').value.trim(),
            timestamp: serverTimestamp()
        };

        try {
            btnSave.disabled = true;
            btnSave.innerText = "Enregistrement en cours...";

            const docRef = await addDoc(collection(db, "fin"), reportData);
            alert("Rapport enregistré avec succès dans la collection 'fin' ! (ID: " + docRef.id + ")");
        } catch (error) {
            console.error("Erreur lors de l'enregistrement : ", error);
            alert("Erreur lors de l'enregistrement : " + error.message);
        } finally {
            btnSave.disabled = false;
            btnSave.innerText = "Enregistrer dans Firebase";
        }
    };

    // Recherche et chargement depuis la collection 'fin'
    window.executeFirebaseSearch = async function() {
        const btnLoad = document.getElementById('btn-load');
        const searchDate = document.getElementById('search-date').value;
        const searchKeyword = document.getElementById('search-keyword').value.trim().toLowerCase();

        closeSearchModal();

        try {
            btnLoad.disabled = true;
            btnLoad.innerText = "Recherche...";

            const collectionRef = collection(db, "fin");
            let docsList = [];

            if (searchDate) {
                const q = query(collectionRef, where("date", "==", searchDate));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach(doc => docsList.push(doc.data()));
            } else {
                const q = query(collectionRef, orderBy("timestamp", "desc"), limit(20));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach(doc => docsList.push(doc.data()));
            }

            if (searchKeyword !== '') {
                docsList = docsList.filter(data => {
                    const nomMatch = (data.nom || '').toLowerCase().includes(searchKeyword);
                    const sigMatch = (data.signatureText || '').toLowerCase().includes(searchKeyword);
                    const appelsMatch = (data.appels || '').toLowerCase().includes(searchKeyword);
                    const obsMatch = (data.observations || '').toLowerCase().includes(searchKeyword);
                    return nomMatch || sigMatch || appelsMatch || obsMatch;
                });
            }

            if (docsList.length === 0) {
                alert("Aucun rapport ne correspond à vos critères de recherche.");
                return;
            }

            docsList.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
            const data = docsList[0];

            if (data.date) document.getElementById('date').value = data.date;
            if (data.horaire) document.getElementById('horaire').value = data.horaire;
            if (data.nom) document.getElementById('nom').value = data.nom;
            if (data.signatureText) document.getElementById('signature-input').value = data.signatureText;
            if (data.appels) document.getElementById('appels').value = data.appels;
            if (data.interventions) document.getElementById('interventions').value = data.interventions;
            if (data.piscine) document.getElementById('piscine').value = data.piscine;
            if (data.urgence) document.getElementById('urgence').value = data.urgence;
            if (data.travaux) document.getElementById('travaux').value = data.travaux;
            if (data.observations) document.getElementById('observations').value = data.observations;
            if (data.details) document.getElementById('details').value = data.details;

            // Cocher les cases de sujets
            document.querySelectorAll('#sujets-traites input[type="checkbox"]').forEach(cb => {
                cb.checked = Array.isArray(data.sujetsTraites) && data.sujetsTraites.some(val => cb.parentNode.textContent.trim().includes(val));
            });

            // Cocher les cases de piscine
            document.querySelectorAll('#piscine-options input[type="checkbox"]').forEach(cb => {
                cb.checked = Array.isArray(data.piscineOptions) && data.piscineOptions.some(val => cb.parentNode.textContent.trim().includes(val));
            });

            alert("Rapport chargé avec succès !");
        } catch (error) {
            console.error("Erreur lors du chargement : ", error);
            alert("Erreur lors du chargement : " + error.message);
        } finally {
            btnLoad.disabled = false;
            btnLoad.innerText = "Charger depuis Firebase";
        }
    };
</script>

<script>
/* DATE DU JOUR */
document.getElementById("date").value = new Date().toISOString().split("T")[0];

/* DICTÉE VOCALE */
function dictee(id){
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        alert("Dictée vocale non supportée par votre navigateur.");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'fr-CA';

    recognition.onresult = (event) => {
        const inputField = document.getElementById(id);
        const text = event.results[0][0].transcript;
        inputField.value += (inputField.value ? " " : "") + text;
    };

    recognition.start();
}

/* SIGNATURE */
const canvas = document.getElementById("signature");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
}

resizeCanvas();

window.addEventListener("resize", () => {
    resizeCanvas();
});

let draw = false;

function getPos(e){
    const rect = canvas.getBoundingClientRect();
    if(e.touches && e.touches.length > 0){
        return {
            x: e.touches[0].clientX - rect.left,
            y: e.touches[0].clientY - rect.top
        };
    }
    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}

function startDraw(e){
    e.preventDefault();
    draw = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
}

function drawMove(e){
    if(!draw) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#000";
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
}

function stopDraw(){
    draw = false;
}

canvas.addEventListener("mousedown", startDraw);
canvas.addEventListener("mousemove", drawMove);
canvas.addEventListener("mouseup", stopDraw);
canvas.addEventListener("mouseout", stopDraw);

canvas.addEventListener("touchstart", startDraw, { passive: false });
canvas.addEventListener("touchmove", drawMove, { passive: false });
canvas.addEventListener("touchend", stopDraw, { passive: false });

function effacerSignature(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

/* RÉINITIALISATION */
function resetForm() {
    if (confirm("Voulez-vous vraiment réinitialiser le formulaire ?")) {
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        document.querySelectorAll('input[type="text"]').forEach(input => input.value = '');
        document.querySelectorAll('textarea').forEach(ta => ta.value = '');
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
        effacerSignature();
    }
}
</script>
